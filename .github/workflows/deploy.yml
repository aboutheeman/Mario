name: Deploy to Server

on:
  push:
    branches: [ claude/serene-keller-ah8t9z ]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject Supabase config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          sed -i "s#__SUPABASE_URL__#${SUPABASE_URL}#g" index.html
          sed -i "s#__SUPABASE_ANON_KEY__#${SUPABASE_ANON_KEY}#g" index.html

      - name: Copy site files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: "index.html"
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 0
